[project]
name = "sandcastle-dashboard"
version = "0.1.0"
description = "TUI for viewing running sandcastle sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "textual>=0.58",
    "httpx>=0.27",
]

[project.scripts]
sandcastle-dashboard = "sandcastle_dashboard.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
